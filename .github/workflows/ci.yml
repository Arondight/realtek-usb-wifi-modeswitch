name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # "latest" installs the newest shfmt release; pin a module version (for
  # example "v3.14.1") for reproducible formatting checks.
  SHFMT_TAG: latest

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          if [[ "$SHFMT_TAG" == "latest" ]]; then
            go install mvdan.cc/sh/v3/cmd/shfmt@latest
          else
            go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_TAG}"
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          shellcheck --version
          "$(go env GOPATH)/bin/shfmt" --version
      - name: ShellCheck
        run: shellcheck modeswitch.sh install.sh tests/smoke.sh tests/unit.sh
      - name: shfmt
        run: shfmt -i 4 -ci -d modeswitch.sh install.sh tests/smoke.sh tests/unit.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke tests
        run: bash tests/smoke.sh
      - name: Unit tests
        run: bash tests/unit.sh

  install:
    name: Install test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, run and uninstall
        run: |
          sudo ./install.sh --prefix /usr
          modeswitch --version
          modeswitch help >/dev/null
          test -s /usr/share/man/man8/modeswitch.8
          grep -q '^\.TH MODESWITCH' /usr/share/man/man8/modeswitch.8
          sudo ./install.sh --prefix /usr --uninstall
          test ! -e /usr/bin/modeswitch
