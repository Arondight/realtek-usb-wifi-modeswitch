name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version
      - name: ShellCheck
        run: shellcheck modeswitch.sh install.sh tests/smoke.sh tests/unit.sh
      - name: shfmt
        run: shfmt -i 4 -ci -d modeswitch.sh install.sh tests/smoke.sh tests/unit.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke tests
        run: bash tests/smoke.sh
      - name: Unit tests
        run: bash tests/unit.sh

  install:
    name: Install test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, run and uninstall
        run: |
          sudo ./install.sh --prefix /usr
          modeswitch --version
          modeswitch help >/dev/null
          test -s /usr/share/man/man8/modeswitch.8
          grep -q '^\.TH MODESWITCH' /usr/share/man/man8/modeswitch.8
          sudo ./install.sh --prefix /usr --uninstall
          test ! -e /usr/bin/modeswitch
